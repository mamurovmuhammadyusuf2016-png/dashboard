name: Deploy web (GitHub Pages)

on:
  push:
    branches: [claude/personal-dashboard-socials-njek7g]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /dashboard/
      # Publishes dist/ to the gh-pages branch. GitHub serves that branch at
      # https://<owner>.github.io/dashboard/ (Settings → Pages → Source: gh-pages, if not enabled automatically).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy web build ${{ github.run_number }}'
